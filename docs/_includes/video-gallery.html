{% if include.videos.size > 0 %}
<div class="video-container">
{%- for vid in include.videos -%}
  <figure>
    <video controls loop muted>
      <source src="{{ include.data.image_path | absolute_url}}/{{ vid.video }}" alt="{{vid.text | escape}}">
    </video>
    {% if vid.text %}
      <figcaption>
      {{vid.text}}
      </figcaption>
    {% endif %}
  </figure>
{% endfor %}
</div>
{% endif %}
